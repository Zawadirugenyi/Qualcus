# ============================================================
#  Qualcus — Nginx configuration for a Hostinger VPS
#  1. copy to /etc/nginx/sites-available/qualcus
#  2. ln -s /etc/nginx/sites-available/qualcus /etc/nginx/sites-enabled/
#  3. rm -f /etc/nginx/sites-enabled/default
#  4. nginx -t && systemctl reload nginx
#  5. certbot --nginx -d qualcus.com -d www.qualcus.com
#
#  Routing:
#    /                -> the React SPA  (/var/www/qualcus)
#    /assets/         -> the React SPA  (long cache)
#    /api/            -> Payload CMS   (127.0.0.1:3001)
#    /admin           -> Payload CMS   (127.0.0.1:3001)
#    /_next/          -> Payload CMS   (127.0.0.1:3001)  <- admin JS/CSS
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name qualcus.com www.qualcus.com;

    root /var/www/qualcus;
    index index.html;

    client_max_body_size 25M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------- React SPA (static build) ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets never change
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ---------- Payload CMS ----------
    # Same domain as the site: no CORS needed.
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 25M;
    }

    location /admin {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Keep the CMS out of search results
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # The admin page loads its JS/CSS from /_next/static/... — that path must
    # reach the CMS, not the React SPA, or the admin renders as a blank page.
    location /_next/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
